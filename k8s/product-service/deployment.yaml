apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 8
  selector:
    matchLabels: { app: product-service, track: stable }
  template:
    metadata:
      labels: { app: product-service, track: stable }
    spec:
      containers:
        - name: product-service
          image: ghcr.io/13nour11/enterprise-ecommerce-platform/product-server:sha-e5d5413
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: product-config }
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: product-secrets, key: DB_PASSWORD }
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
